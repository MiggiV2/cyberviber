; cyberviber firmware for the ESP32-2432S024R (ILI9341 240×320, XPT2046 resistive touch)
; Flash:  cyberviber release && pio run -t upload

[env:cyd24r]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; same firmware, but every touch is reported as {"type":"log","raw":[x,y],"pt":[x,y]} (calibration)
[env:cyd24r-touchlog]
extends = env:cyd24r
build_flags = ${env:cyd24r.build_flags} -DCV_TOUCH_LOG
